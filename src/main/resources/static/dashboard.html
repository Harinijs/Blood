<!DOCTYPE html>
<html>

<head>

    <title>Donor Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #b30000;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            display: inline-block;
        }

        .logout {
            float: right;
            color: white;
            text-decoration: none;
            margin-top: 5px;
        }

        .dashboard {
            width: 80%;
            margin: 40px auto;
        }

        .welcome {
            background-color: white;
            padding: 25px;
            border: 1px solid #ddd;
        }

        .welcome h2 {
            color: #b30000;
            margin-top: 0;
        }

        .details {
            background-color: white;
            margin-top: 25px;
            padding: 25px;
            border: 1px solid #ddd;
        }

        .details h2 {
            color: #b30000;
        }

        .details p {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Blood Donation</h1>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>


    <div class="dashboard">

        <div class="welcome">

            <h2>Donor Dashboard</h2>

            <p id="welcomeMessage">
                Welcome to your donor account.
            </p>

        </div>


        <div class="details">

            <h2>Donor Information</h2>

            <p>
                Age:
                <span id="age"></span>
            </p>

            <p>
                Gender:
                <span id="gender"></span>
            </p>

            <p>
                Phone:
                <span id="phone"></span>
            </p>

            <p>
                Blood Group:
                <span id="bloodGroup"></span>
            </p>

            <p>
                Email:
                <span id="email"></span>
            </p>

            <p>
                Location:
                <span id="location"></span>
            </p>

            <p>
                Last Donation:
                <span id="lastDonationDate"></span>
            </p>

        </div>

    </div>


    <script>

        fetch("/donor-info")
            .then(response => response.json())
            .then(donor => {

                document.getElementById("age").textContent = donor.age;
                document.getElementById("gender").textContent = donor.gender;
                document.getElementById("phone").textContent = donor.phone;
                document.getElementById("bloodGroup").textContent = donor.bloodGroup;
                document.getElementById("email").textContent = donor.email;
                document.getElementById("location").textContent = donor.location;
                document.getElementById("lastDonationDate").textContent =
                    donor.lastDonationDate;

                document.getElementById("welcomeMessage").textContent =
                    "Welcome back, " + donor.email + ".";

            });

    </script>

</body>

</html>
