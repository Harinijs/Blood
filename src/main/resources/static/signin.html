<!DOCTYPE html>
<html>

<head>

    <title>Donor Sign In</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #b30000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .login-container {
            width: 400px;
            margin: 70px auto;
            background-color: white;
            padding: 30px;
            border: 1px solid #ddd;
        }

        h2 {
            text-align: center;
            color: #b30000;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #bbb;
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            background-color: #b30000;
            color: white;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            background-color: #800000;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #b30000;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Blood Donation</h1>
    </div>


    <div class="login-container">

        <h2>Donor Sign In</h2>

        <form action="/signin" method="post">

            <label>Email</label>
            <input type="email" name="email" required>


            <label>Password</label>
            <input type="password" name="password" required>


            <button type="submit" class="button">
                Sign In
            </button>

        </form>


        <div class="link">
            New donor?
            <a href="/signup">Register here</a>
        </div>

    </div>

</body>

</html>
