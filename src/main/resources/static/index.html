<!DOCTYPE html>
<html>

<head>
    <title>Blood Donation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .header {
            background-color: #b30000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .content {
            width: 70%;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .content h2 {
            color: #b30000;
        }

        .content p {
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            background-color: #b30000;
            color: white;
            padding: 12px 25px;
            margin: 15px 5px;
            text-decoration: none;
            border-radius: 4px;
        }

        .button:hover {
            background-color: #800000;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 15px;
            color: #777;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Blood Donation Management System</h1>
    </div>


    <div class="content">

        <h2>Welcome</h2>

        <p>
            This system allows blood donors to register their details
            and maintain their donor information.
        </p>

        <p>
            If you are a new donor, register your details.
            Existing donors can sign in to their account.
        </p>

        <a href="/signup" class="button">Register as Donor</a>

        <a href="/signin" class="button">Sign In</a>

    </div>


    <div class="footer">
        Blood Donation Management System
    </div>

</body>

</html>
